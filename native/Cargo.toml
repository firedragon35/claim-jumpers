# Native Windows port of Claim Jumpers. The browser game (repository claim-jumpers-game) is
# the reference implementation; this workspace must match its behaviour.
#
# crates/cj-sim   the pure, deterministic gameplay simulation (builds on any OS)
# crates/cj-game  the macroquad application, claim-jumpers.exe (Windows)
[workspace]
resolver = "2"
members = ["crates/cj-sim", "crates/cj-game"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[profile.release]
# Small, fast release builds; the game ships as one executable.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
