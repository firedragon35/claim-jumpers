# Native Windows port of Claim Jumpers. The browser game in the repository root is
# the reference implementation; this workspace must match its behaviour.
#
# crates/cj-sim   the pure, deterministic gameplay simulation (builds on any OS)
# crates/cj-game  the macroquad application, claim-jumpers.exe (Windows)
# spikes/m0-spike the Milestone 0 risk-test program, kept for reference only. It is a
#                 workspace member so `cargo run -p m0-spike` still works, but it is not a
#                 default member, so plain `cargo build` and `cargo test` skip it.
[workspace]
resolver = "2"
members = ["crates/cj-sim", "crates/cj-game", "spikes/m0-spike"]
default-members = ["crates/cj-sim", "crates/cj-game"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[profile.release]
# Small, fast release builds; the game ships as one executable.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
