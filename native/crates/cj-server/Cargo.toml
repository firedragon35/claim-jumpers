[package]
name = "cj-server"
# Kept equal to cj-game's version (check.sh verifies it): a client and a
# server must run the same game version to play together.
version = "1.4.0"
description = "Claim Jumpers authoritative multiplayer server: the session library and a headless binary."
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cj-server"
path = "src/main.rs"

[dependencies]
cj-sim = { path = "../cj-sim" }
cj-net = { path = "../cj-net" }
renet = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
# The UDP transport for the headless binary (the game's host uses renet's
# in-memory local client instead).
renet_netcode = "2.0.1"
