[package]
name = "cj-net"
version = "0.1.0"
description = "Claim Jumpers network protocol: messages, limits, validation and per-pilot snapshots."
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cj-sim = { path = "../cj-sim" }
serde = { version = "1.0.229", features = ["derive"] }
# Compact binary encoding for every message (no_std-friendly, varint integers).
postcard = { version = "1.1.3", features = ["use-std"] }
