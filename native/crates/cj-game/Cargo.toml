[package]
name = "cj-game"
version = "1.12.0"
description = "Claim Jumpers native Windows game: window, rendering and input around cj-sim."
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "claim-jumpers"
path = "src/main.rs"

[dependencies]
cj-sim = { path = "../cj-sim" }
# The network protocol (and the pilot-name rule it shares with the server).
cj-net = { path = "../cj-net" }
# Joining a server: renet's connection layer and its UDP netcode transport.
renet = "2.0.1"
renet_netcode = "2.0.1"
# Hosting a server inside the game, with the same loop as cj-server.
cj-server = { path = "../cj-server" }
# Default features off: macroquad would open its own audio device, and
# the game synthesizes its sound through cpal instead.
macroquad = { version = "0.4.16", default-features = false }
gilrs = "0.11.2"
# Audio output (WASAPI on Windows) for the procedural synthesizer.
cpal = "0.18.2"
# The best-shift file is JSON, as the browser stores it.
serde_json = "1.0.145"
